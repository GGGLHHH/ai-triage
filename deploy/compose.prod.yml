# 生产:nginx(对外唯一端口)→ app → kb-db(pgvector)。
# kb-db 只挂在 internal 网络:不映射宿主机端口、也出不了外网,只有 app 连得到。
# app 同时挂 web 网络,用来被 nginx 访问和出网调大模型 / embedding。
# 由 deploy.sh 启动(它会先 docker load 镜像、导知识库);配置全在同目录 .env。
name: ai-triage-prod

services:
  nginx:
    image: nginx:1.28.3-alpine
    ports:
      - ${HTTP_PORT:-80}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [web]
    restart: unless-stopped

  app:
    image: ai-triage:${APP_VERSION:?缺 APP_VERSION,请用 deploy.sh 启动}
    env_file: .env
    environment:
      KB_DATABASE_URL: postgres://kb:${KB_DB_PASSWORD:?.env 里缺 KB_DB_PASSWORD}@kb-db:5432/kb
    depends_on:
      kb-db:
        condition: service_healthy
    networks: [web, internal]
    restart: unless-stopped

  kb-db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:?.env 里缺 KB_DB_PASSWORD}
      POSTGRES_DB: kb
    volumes:
      - kb-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kb -d kb]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

networks:
  web:
  internal:
    internal: true

volumes:
  kb-db:
